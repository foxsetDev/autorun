name: Analog controller build check

on:
  push:
    branches: [analog-controller-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download upstream Mesa Switch SDK
        uses: actions/download-artifact@v4
        with:
          name: mesa-26.2.2-switch-unified-horizon-sdk
          repository: danfromtico/mesa-switch
          run-id: 35860399051
          github-token: ${{ github.token }}
          path: wine-nx-probe/build-mesa-switch/install

      - name: Check Mesa Switch SDK
        run: |
          set -eu
          sdk=wine-nx-probe/build-mesa-switch/install/opt/devkitpro/portlibs/switch/lib
          for lib in EGL GL glapi vulkan mesa_util_c11 blake3 mesa_util mesa_util_simd xmlconfig; do
            test -s "$sdk/lib$lib.a"
          done

      - name: Check stick mapping and per-game setting
        run: |
          set -eu
          clang -std=gnu11 -Wall -Wextra -Werror wine-nx-probe/tests/nx_joystick_axes.c -o /tmp/nx-axes
          /tmp/nx-axes
          clang -std=gnu11 -Wall -Wextra -Werror wine-nx-probe/tests/launcher_settings.c -o /tmp/nx-settings
          /tmp/nx-settings
          clang -std=gnu11 -Wall -Wextra -Werror -D__WINESRC__ -DWINE_UNIX_LIB -D_WIN64 \
            -Iwine-nx-probe/tests/xinput-shims -Iinclude \
            wine-nx-probe/tests/xinput_nx_pad.c -o /tmp/nx-pad
          /tmp/nx-pad

      - name: Install Wine build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex gettext make gcc g++ pkg-config xz-utils
          curl -fL --retry 3 -o /tmp/llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260505/llvm-mingw-20260505-ucrt-ubuntu-22.04-aarch64.tar.xz
          mkdir -p /tmp/nx-toolchain
          tar -xJf /tmp/llvm-mingw.tar.xz -C /tmp/nx-toolchain --strip-components=1
          rm /tmp/llvm-mingw.tar.xz
          /tmp/nx-toolchain/bin/i686-w64-mingw32-clang --version

      - name: Compile modified Wine DLLs
        run: |
          set -eu
          export PATH="/tmp/nx-toolchain/bin:$PATH"
          mkdir -p wine-nx-probe/build-wine-wow64-pe
          cd wine-nx-probe/build-wine-wow64-pe
          ../../configure --enable-archs=aarch64,i386 --enable-winebox64=aarch64 \
            --disable-tests --without-x --without-freetype --without-alsa \
            --without-pulse --without-dbus --without-fontconfig --without-udev \
            --without-usb --without-gstreamer --without-vulkan
          make -j4 include/all \
            dlls/dinput/i386-windows/dinput.dll \
            dlls/dinput8/i386-windows/dinput8.dll \
            dlls/xinput1_3/i386-windows/xinput1_3.dll \
            dlls/winebox64/aarch64-windows/winebox64.dll \
            dlls/wow64/aarch64-windows/wow64.dll \
            dlls/wow64win/aarch64-windows/wow64win.dll \
            dlls/ntdll/aarch64-windows/ntdll.dll \
            dlls/win32u/aarch64-windows/win32u.dll \
            dlls/apisetschema/aarch64-windows/apisetschema.dll

      - name: Compile Switch runtime with Mesa Switch graphics libraries
        run: |
          set -eu
          sh wine-nx-probe/tools/bootstrap-box64-core.sh
          docker run --rm --platform linux/arm64 -v "$PWD:/work" -w /work \
            devkitpro/devkita64 sh -ec '
              git config --global --add safe.directory /work
              git config --global --add safe.directory /work/wine-nx-probe/vendor/box64
              cmake -S wine-nx-probe -B wine-nx-probe/build-switch-wow64-dynarec -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE=/work/wine-nx-probe/cmake/switch-devkitA64.cmake \
                -DWINE_NX_PE_BUILD_DIR=/work/wine-nx-probe/build-wine-wow64-pe \
                -DWINE_NX_BOX64_DYNAREC=ON -DCMAKE_BUILD_TYPE=Release \
                -DWINE_NX_MESA_SWITCH_DIR=/work/wine-nx-probe/build-mesa-switch/install/opt/devkitpro/portlibs/switch/lib
              cmake --build wine-nx-probe/build-switch-wow64-dynarec --target wine-nx-runtime-nro -j4
            '

      # Compile-only: neither the runtime nor controller mapping has been tested on Switch.
      - uses: actions/upload-artifact@v4
        with:
          name: analog-controller-compile-only
          path: |
            wine-nx-probe/build-wine-wow64-pe/dlls/dinput/i386-windows/dinput.dll
            wine-nx-probe/build-wine-wow64-pe/dlls/dinput8/i386-windows/dinput8.dll
            wine-nx-probe/build-wine-wow64-pe/dlls/xinput1_3/i386-windows/xinput1_3.dll
            wine-nx-probe/build-switch-wow64-dynarec/wine-nx-runtime.nro
          if-no-files-found: error
          retention-days: 3
